[package]
name = "hud"
version = "1.0.0"
description = "Functional terminal UX for Rust: styled text, tables, panels, trees, progress, live displays and layouts, byte for byte what Python Rich writes, as rich text, plain text or JSON."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["terminal", "cli", "tui", "table", "ansi"]
categories = ["command-line-interface"]

[dependencies]
hud-width = { path = "../hud-width", version = "1.0.0" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "termios"] }

[target.'cfg(windows)'.dependencies]
terminal_size = "0.4"
enable-ansi-support = "0.3"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"

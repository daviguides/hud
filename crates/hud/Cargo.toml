[package]
name = "hud"
version = "0.1.0"
description = "Functional terminal UX for Rust: capability detection, cell width and, as the milestones land, styled output, tables, panels and progress."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["terminal", "cli", "tui", "table", "ansi"]
categories = ["command-line-interface"]
publish = false

[dependencies]
hud-width = { path = "../hud-width", version = "0.1.0" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "termios"] }

[lints]
workspace = true

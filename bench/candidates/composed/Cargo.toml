[package]
name = "hud-bench-composed"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
owo-colors = { version = "=4.4.0", features = ["supports-colors"] }
comfy-table = { version = "=8.0.1", features = ["custom_styling"] }
indicatif = "=0.18.6"
console = "=0.16.6"
supports-color = "=3.0.2"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
serde_json = "=1.0.145"

[profile.release]
strip = "symbols"

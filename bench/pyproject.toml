[project]
name = "hud-bench"
version = "0.0.0"
description = "Benchmark harness and golden fixtures for the hud evaluation"
requires-python = ">=3.12"
dependencies = [
    "rich==15.0.0",
    "wcwidth>=0.2.13",
    "regex>=2024.11.6",
    "pyte>=0.8.2",
    "numpy>=2.0",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

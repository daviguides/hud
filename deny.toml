[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # hud is its own engine: no wrapper over, and no dependency on, another Rich port or the
    # crates its pilot measured as the composed baseline.
    { name = "rs-rich" },
    { name = "rich_rust" },
    { name = "richrs" },
    { name = "rich-rs" },
    { name = "comfy-table" },
    { name = "tabled" },
    { name = "indicatif" },
    { name = "kdam" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
